spring.application.name=order-service

# H2 Datasource
spring.datasource.url=jdbc:h2:mem:orderdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#CACHE REDIS
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

#rabbitmq
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
messaging.exchange.domain-events=domain.events
messaging.routing-key.order-created=order.created
messaging.routing-key.order-status-updated=order.status.updated
messaging.queue.order-commands=order.commands.queue
outbox.scheduler.fixed-delay=30000

